services:
  backend:
    build: ./backend

    container_name: comi-lios-backend

    ports:
      - "8000:8000"
      
    env_file:
      - ./backend/.env
  frontend:
    build: ./frontend

    container_name: comi-lios-frontend

    ports:
      - "80:80"

    depends_on:
      - backend
  db:
    image: postgres:17

    container_name: comi-lios-postgres

    environment:
      POSTGRES_DB: comi_lios
      POSTGRES_USER: user
      POSTGRES_PASSWORD: contra

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
 
volumes:
  postgres_data: